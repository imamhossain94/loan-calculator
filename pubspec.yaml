name: loan_calculator
description: Loan, savings, tax, discount and tip calculators.

publish_to: 'none'

version: 1.6.0+10

environment:
  sdk: ^3.9.0

dependencies:
  another_flushbar: ^2.2.4
  cupertino_icons: ^1.0.9
  flutter:
    sdk: flutter
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4
  intl: ^0.20.3
  package_info_plus: ^10.2.1
  path_provider: ^2.1.6
  pdf: ^3.13.0
  printing: ^5.15.0
  screenshot: ^3.0.0
  share_plus: ^13.3.0
  url_launcher: ^6.3.2

dev_dependencies:
  build_runner: ^2.15.1
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter
  hive_ce_generator: ^1.11.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Audiowide
      fonts:
        - asset: fonts/Audiowide-Regular.ttf

flutter_native_splash:
  color: "#E3EBEC"
  image: assets/images/ic_launcher.png
  color_dark: "#212230"
  image_dark: assets/images/ic_launcher.png
  android_gravity: center
  fullscreen: true
