name: loan_calculator
description: A new Flutter application.

publish_to: 'none'

version: 1.0.2

environment:
  sdk: ">=2.7.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter

  url_launcher: ^6.0.9
  google_mobile_ads: ^0.13.3
  flutter_dotenv: ^5.0.0
  flutter_inapp_purchase: ^5.0.2
  flushbar: ^1.3.0
  hive: ^2.0.4
  hive_flutter: ^1.1.0
  path_provider: ^2.0.2
  share: ^2.0.4
  intl: ^0.17.0
  pdf: ^3.4.2
  flutter_pdfview: ^1.0.4
  flutter_email_sender: ^5.0.2
  permission_handler: ^8.1.4+2
  shared_preferences: ^2.0.6
  cupertino_icons: ^1.0.0
  flutter_native_splash: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  hive_generator: ^1.1.0
  build_runner: ^2.1.0


flutter:

  uses-material-design: true

  assets:
    - .env
    - assets/images/

  fonts:
    - family: Audiowide
      fonts:
        - asset: fonts/Audiowide-Regular.ttf



flutter_native_splash:
  color: "#E3EBEC"
  image: images/ic_launcher.png
  color_dark: "#212230"
  image_dark: images/ic_launcher.png
  android_gravity: center
  fullscreen: true